# Alembic settings. Run from backend/:  python -m alembic upgrade head
# The database URL is deliberately not in this file: alembic/env.py reads DATABASE_URL from the environment.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# Logging for the alembic command (prints each migration as it runs).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
